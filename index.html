<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryan Decker</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <main id="home">
    <button id="logo-button" class="logo-button" aria-label="Open bio">
      <img src="assets/logo.png" alt="Your logo">
    </button>
    <div id="project-field" aria-label="Projects"></div>
  </main>

  <section id="gallery" class="overlay" aria-hidden="true">
    <button class="close-button" aria-label="Close gallery">×</button>
    <button class="gallery-arrow gallery-prev" aria-label="Previous image">←</button>
    <div class="gallery-content">
      <div id="gallery-media"></div>
      <div id="gallery-text" class="gallery-text"></div>
    </div>
    <button class="gallery-arrow gallery-next" aria-label="Next image">→</button>
  </section>

  <section id="bio" class="overlay" aria-hidden="true">
    <button class="close-button" aria-label="Close bio">×</button>
    <div class="bio-content">
  <img src="assets/me.jpg" alt="Portrait">

  <div class="bio-info">
    <div id="bio-text" class="bio-text"></div>

<!--     <a
      href="assets/CV.pdf"
      target="_blank"
      class="cv-link"
    >
      CV
    </a> -->
  </div>
</div>
  </section>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
