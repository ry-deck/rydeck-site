<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Tinamarie!!!! ♥</title>
<style>
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;background:#ffc8e8 url('background.jpg') repeat;background-size:240px;color:#4e164c;font-family:'Comic Sans MS','Trebuchet MS',cursive;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background:rgba(255,185,224,.13);pointer-events:none}a{color:#d50089}.page{position:relative;max-width:1180px;margin:auto;padding:24px 20px 90px;z-index:1}.topline{text-align:center;background:#fffc;border:3px dashed #ff2a9c;padding:6px;font-weight:bold;letter-spacing:2px}.headline{text-align:center;margin:20px 0 10px;font-size:clamp(2.4rem,7.2vw,6rem);line-height:1.1;font-family:Impact,'Arial Black',sans-serif;font-style:italic;letter-spacing:1px;color:#ffea00;-webkit-text-stroke:2px #d21b94;text-shadow:3px 3px 0 #fff,6px 6px 0 #7b30cb,9px 9px 0 #ff66bb;transform:rotate(-2deg)}.sparkles{text-align:center;font-size:clamp(17px,3vw,27px);color:#c3008a;text-shadow:2px 2px #fff}.marquee{overflow:hidden;white-space:nowrap;border:4px ridge #ff88c6;background:#fff5a8;margin:24px 0;padding:9px 0;color:#c90088;font-weight:bold}.marquee span{display:inline-block;padding-left:100%;animation:slide 16s linear infinite}@keyframes slide{to{transform:translateX(-100%)}}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:28px;align-items:start}.paper{position:relative;background:#fff9e8;padding:22px;box-shadow:7px 9px 0 #c34a9a77,0 0 0 3px #fff6;border:1px solid #e5bda9;clip-path:polygon(0 1%,4% 0,9% 1%,15% 0,21% 1%,27% 0,33% 1%,40% 0,47% 1%,54% 0,61% 1%,69% 0,76% 1%,83% 0,91% 1%,96% 0,100% 1%,99% 10%,100% 18%,99% 27%,100% 37%,99% 47%,100% 58%,99% 68%,100% 79%,99% 90%,100% 99%,94% 100%,87% 99%,80% 100%,73% 99%,65% 100%,57% 99%,49% 100%,41% 99%,33% 100%,25% 99%,17% 100%,9% 99%,0 100%,1% 90%,0 80%,1% 70%,0 60%,1% 50%,0 40%,1% 30%,0 20%,1% 10%)}.paper h2{margin:4px 0 15px;text-align:center;color:#db168f;text-shadow:2px 2px #f8d3ef;font-size:1.65rem}.video{width:100%;aspect-ratio:16/9;background:#241025;border:5px ridge #f58cc7;display:block}.letter{font-size:1.05rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;min-height:260px}.stickers{display:flex;justify-content:space-around;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}.sticker{width:120px;max-width:27vw;max-height:140px;object-fit:contain;image-rendering:auto}.sticker:not([src]),.sticker[src='']{display:none}.small-note{text-align:center;font-size:.85rem;color:#8e126f}.bottom{text-align:center;margin:28px auto;max-width:680px;background:#fff9;border:3px dotted #ed2d97;padding:12px}.confetti{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-25px;width:var(--size);height:calc(var(--size)*.62);background:var(--color);left:var(--left);opacity:.8;animation:fall var(--duration) linear infinite;animation-delay:var(--delay);transform:rotate(var(--rot))}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(820deg)}}@media(max-width:760px){.page{padding:14px 12px 60px}.layout{grid-template-columns:1fr;gap:20px}.paper{padding:17px}.headline{-webkit-text-stroke:1px #d21b94;text-shadow:2px 2px #fff,4px 4px #7b30cb,6px 6px #ff66bb}.marquee{margin:18px 0}.letter{min-height:120px}}@media(prefers-reduced-motion:reduce){.piece,.marquee span{animation:none}.confetti{display:none}}
</style>
</head>
<body>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<main class="page">
<h1 class="headline">HAPPY 30th BIRTHDAY<br>TINAMARIE!!!</h1>
<div class="stickers" aria-label="Birthday decorations"><img class="sticker" src="gif1.gif" alt="Birthday decoration" onerror="this.style.display='none'"><img class="sticker" src="gif2.gif" alt="Birthday decoration" onerror="this.style.display='none'"><img class="sticker" src="gif3.gif" alt="Birthday decoration" onerror="this.style.display='none'"></div>
<div class="marquee"><span>★ HAPPY BIRTHDAY ★ I LOVE YOU ★ HAPPY BIRTHDAY ★ I LOVE YOU ★ HAPPY BIRTHDAY ★ I LOVE YOU ★</span></div>
<div class="layout">
<section class="paper"><h2>A Message From Your Hero</h2><video class="video" controls playsinline preload="metadata" poster="video-poster.jpg"><source src="birthday-video.mp4" type="video/mp4">Your browser does not support HTML video.</video><div class="stickers"><img class="sticker" src="gif4.gif" alt="Animated decoration" onerror="this.style.display='none'"><img class="sticker" src="gif5.gif" alt="Animated decoration" onerror="this.style.display='none'"></div></section>
<aside class="paper"><h2>Pretend This Is A Birthday Card 💌</h2><div class="letter" id="letter">Loading your birthday letter... ♥</div></aside>
</div>
</main>
<script>
fetch('letter.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Letter not found');return r.text()}).then(t=>{document.getElementById('letter').textContent=t}).catch(()=>{document.getElementById('letter').textContent='Add your birthday message to letter.txt and it will appear here! ♥'});
// CSS confetti is built in, so no external GIF or library is required.
const confetti=document.getElementById('confetti'),colors=['#ff3e9d','#ffe73b','#4ce5f3','#a75aff','#7af07a','#ffffff'];for(let i=0;i<65;i++){const p=document.createElement('i');p.className='piece';p.style.setProperty('--left',Math.random()*100+'%');p.style.setProperty('--size',(5+Math.random()*9)+'px');p.style.setProperty('--color',colors[i%colors.length]);p.style.setProperty('--duration',(5+Math.random()*9)+'s');p.style.setProperty('--delay',(-Math.random()*15)+'s');p.style.setProperty('--drift',((Math.random()-.5)*180)+'px');p.style.setProperty('--rot',Math.random()*360+'deg');confetti.appendChild(p)}
</script>
</body>
</html>
